name: i18n check

# Validates the localization RESX files on every PR/push that touches them:
# same key set as English, valid XML, consistent {0}/{1} placeholders.
# This guards against community translation PRs that drop keys or break interpolation.
#
# It also checks the hand-maintained Strings.Designer.cs against the English RESX, so that file is a
# trigger path too — otherwise a PR that touches ONLY Designer.cs (adding an accessor for a key that
# doesn't exist, or deleting one that does) would never run this check.
on:
  pull_request:
    paths:
      - 'src/LuaToolsGui/Resources/Strings*.resx'
      - 'src/LuaToolsGui/Resources/Strings.Designer.cs'
      - 'scripts/check-i18n.py'
  push:
    branches: [master, main]
    paths:
      - 'src/LuaToolsGui/Resources/Strings*.resx'
      - 'src/LuaToolsGui/Resources/Strings.Designer.cs'
      - 'scripts/check-i18n.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate translations
        run: python scripts/check-i18n.py
