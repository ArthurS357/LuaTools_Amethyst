name: build

# The repo previously had no build or test workflow at all — only the i18n RESX check — so nothing
# verified that a PR compiled, and the xUnit suite never ran outside a maintainer's machine.
# WPF (net10.0-windows) needs a Windows runner; there is no Linux path for this project.
on:
  pull_request:
  push:
    branches: [master, main]

# A new push to the same PR makes the previous run's result irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the compiler because the compiler reports this badly. 1.7.4 committed the csproj in
      # Windows-1252 and the build failed with "Invalid character in the given encoding. Line 19, position
      # 64." naming no file anyone had edited. The checker's tests run first, as in the i18n workflow: a
      # broken checker reports a clean tree. The runner image ships Python; stdlib only, no install step.
      - name: Test the encoding checker
        run: python -m unittest discover -s scripts/tests -p "test_check_encoding.py"

      - name: Check text encoding
        run: python scripts/check-encoding.py

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore separately so a dependency failure is distinguishable from a compile failure.
      - name: Restore
        run: dotnet restore LuaToolsGui.sln

      - name: Build
        run: dotnet build LuaToolsGui.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LuaToolsGui.sln --configuration Release --no-build --verbosity normal
