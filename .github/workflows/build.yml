name: build

# The repo previously had no build or test workflow at all — only the i18n RESX check — so nothing
# verified that a PR compiled, and the xUnit suite never ran outside a maintainer's machine.
# WPF (net8.0-windows) needs a Windows runner; there is no Linux path for this project.
on:
  pull_request:
  push:
    branches: [master, main]

# A new push to the same PR makes the previous run's result irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restore separately so a dependency failure is distinguishable from a compile failure.
      - name: Restore
        run: dotnet restore LuaToolsGui.sln

      - name: Build
        run: dotnet build LuaToolsGui.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LuaToolsGui.sln --configuration Release --no-build --verbosity normal
